      const initials = name.split(/\s+/).slice(0, 2).map(part => part[0] || '').join('').toUpperCase();
      const ctaClass = `site-button ${style} shape-${shape}`;

      const scheduleRows = Array.isArray(schedule.weekly) || Array.isArray(schedule.sessions)

        : String(schedule || '').split(/\r?\n/).map(line => line.trim()).filter(Boolean).slice(0, 7).map(line => {

      const socialIconPaths = {
        twitch: '<path d="M4 3 2 6v14h5v3h3l3-3h4l5-5V3H4Zm16 11-3 3h-5l-3 3v-3H5V5h15v9ZM10 8v5h2V8h-2Zm5 0v5h2V8h-2Z"/>',
        youtube: '<path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/>',
        instagram: '<path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2.2A2.8 2.8 0 0 0 4.2 7v10A2.8 2.8 0 0 0 7 19.8h10a2.8 2.8 0 0 0 2.8-2.8V7A2.8 2.8 0 0 0 17 4.2H7Zm5 2.2a5.6 5.6 0 1 1 0 11.2 5.6 5.6 0 0 1 0-11.2Zm0 2.2a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8Zm5.9-3.1a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6Z"/>',
        tiktok: '<path d="M19.6 5.2a5.5 5.5 0 0 1-3.4-3.4V1h-4.3v14.8a2.8 2.8 0 1 1-2.8-2.8c.5 0 1 .1 1.4.4V9a7 7 0 1 0 5.7 6.8V8.2a9.7 9.7 0 0 0 5.7 1.8V5.7c-.8 0-1.6-.2-2.3-.5Z"/>',
        facebook: '<path d="M13.5 22v-8h2.7l.4-3.1h-3.1v-2c0-.9.3-1.5 1.6-1.5h1.7V4.6c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.1H7.3V14h2.8v8h3.4Z"/>',
        x: '<path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 14.9 5.8 22H2.6l7.3-8.4L1.8 2h6.5l4.5 6.7L18.9 2Zm-1.1 17.8h1.7L7.3 4H5.5l12.3 15.8Z"/>',
        discord: '<path d="M19.7 5.3A18 18 0 0 0 15.3 4l-.5 1a16 16 0 0 0-5.6 0l-.5-1a18 18 0 0 0-4.4 1.3C1.5 9.4.7 13.4 1.1 17.3a18 18 0 0 0 5.4 2.7l1.2-2a11 11 0 0 1-1.9-.9l.5-.4a13 13 0 0 0 11.4 0l.5.4a11 11 0 0 1-1.9.9l1.2 2a18 18 0 0 0 5.4-2.7c.5-4.5-.8-8.5-3.2-12Zm-11.1 9.6c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Zm6.8 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Z"/>',
        other: '<path d="M14 3h7v7h-2V6.4l-9.3 9.3-1.4-1.4L17.6 5H14V3ZM5 5h6v2H7v10h10v-4h2v6H5V5Z"/>'
      };
      const socialIconMarkup = links.filter(link => link.label && link.url).map(link => {
        const href = safeLink(link.url);
        if (!href) return '';
        const platform = String(link.platform || '').toLowerCase();
        const icon = socialIconPaths[platform] || socialIconPaths.other;
        const external = href.startsWith('mailto:') ? '' : ' target="_blank" rel="noopener noreferrer"';
        return `<a class="site-hero-social-link" href="${escapeHtml(href)}" aria-label="${escapeHtml(link.label)}" title="${escapeHtml(link.label)}"${external}><svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg></a>`;
      }).join('');
      document.title = `${name} · Twitch Creator`;
      document.querySelector('meta[name="theme-color"]').content = backgroundColor;
      document.querySelector('meta[name="description"]').content = `${tagline || 'Live updates, stream times, highlights, and community links.'} Visit the ${name} Twitch creator site.`;
      document.querySelector('meta[property="og:title"]').content = `${name} · Twitch Creator`;
      document.querySelector('meta[property="og:description"]').content = tagline || `Visit ${name} for live updates, stream times, highlights, and community links.`;
      document.querySelector('meta[property="og:image"]').content = heroImage;
      document.documentElement.style.setProperty('--site-bg', backgroundColor);
      document.documentElement.style.setProperty('--site-ink', textColor);
      document.documentElement.style.setProperty('--site-accent', buttonColor);
      document.documentElement.style.setProperty('--site-button-text', buttonTextColor);
      root.className = 'creator-site';
      root.innerHTML = `<header class="site-nav"><a class="site-wordmark" href="#top"><span class="site-mark">${avatar ? `<img src="${escapeHtml(avatar)}" alt="">` : escapeHtml(initials || 'C')}</span>${escapeHtml(name)}</a><nav class="site-nav-links" aria-label="Website navigation"><a href="#about">About</a><a href="#highlights">Highlights</a><a href="#shop">Shop</a><a href="#community">Community</a></nav>${twitchUrl ? `<a class="site-nav-cta ${style} shape-${shape}" data-nav-live-cta style="--site-accent:${escapeHtml(buttonColor)};--site-button-text:${escapeHtml(buttonTextColor)}" href="${escapeHtml(twitchUrl)}" target="_blank" rel="noopener noreferrer">${live ? 'Live now' : 'Twitch'} <span aria-hidden="true">↗</span></a>` : ''}</header><section class="site-hero" id="top"><img class="site-hero-image" src="${escapeHtml(heroImage)}" alt="Gaming setup" fetchpriority="high"><div class="site-hero-copy"><span class="site-status ${liveStatusClass}" data-live-status aria-live="polite"><span class="site-status-dot"></span>${escapeHtml(liveStatusLabel)}</span><p class="site-eyebrow">${handle ? escapeHtml(handle.startsWith('@') ? handle : `@${handle}`) : 'Twitch creator'}</p><h1>${escapeHtml(name)}</h1><p class="site-hero-tagline">${escapeHtml(tagline)}</p><div class="site-hero-actions">${watchButton}</div></div><a class="site-scroll-cue" href="#about">Scroll to explore</a></section><section class="site-section site-about" id="about"><div><div class="site-section-head"><p class="site-kicker">The person behind the stream</p><h2>${escapeHtml(aboutHeading)}</h2></div><div class="site-about-copy">${escapeHtml(about || 'A little more about the stream is on the way.')}</div></div><aside class="site-schedule"><p class="site-kicker">Stream schedule</p><h3>Catch the next one</h3><div class="site-schedule-list">${scheduleRows}</div></aside></section><section class="site-section site-featured" id="highlights"><div class="site-section-head"><p class="site-kicker">From the channel</p><h2>Recent highlights</h2></div><div class="site-feature-grid">${featuredMarkup}</div></section><section class="site-section site-community" id="community"><div><p class="site-kicker">The community</p><h2>Make yourself at home.</h2><p>Come by the stream, say hello, and be part of what we build next.</p></div>${watchButton}</section>${linkMarkup ? `<nav class="site-socials" aria-label="More ways to follow">${linkMarkup}</nav>` : ''}<footer class="site-footer"><span>${escapeHtml(name)} · Twitch creator</span><a href="#top">Back to top ↑</a></footer>`;
      {
        const shop = document.createElement('section');
        shop.className = 'site-section site-shop';
        shop.id = 'shop';
        const shopContent = products.length ? `<div class="site-shop-grid">${products.map((item, index) => {
          const image = item.imageUrl ? `<img class="site-product-image" src="${escapeHtml(item.imageUrl)}" alt="${escapeHtml(item.name)}" loading="lazy">` : `<div class="site-product-image-placeholder" aria-hidden="true">${escapeHtml(item.name.slice(0, 1).toUpperCase())}</div>`;
          const variants = item.variants.filter(variant => variant.id && variant.inStock);
          const checkoutFor = variantId => {
            if (item.checkoutUrl) return item.checkoutUrl;
            if (fourthwallDomain && variantId && item.provider === 'fourthwall') {
              const checkout = new URL('/cart/checkout', fourthwallDomain);
              checkout.searchParams.set('products', `${variantId}:1`);
              checkout.searchParams.set('currency', variants.find(variant => variant.id === variantId)?.currency || item.currency || 'USD');
              return checkout.href;
            }
            return '';
          };
          const firstVariant = variants[0];
          const checkoutUrl = checkoutFor(firstVariant?.id || '');
          const price = item.price || (firstVariant ? `${firstVariant.price} ${firstVariant.currency}` : '');
          const selector = variants.length > 1 ? `<label class="sr-only" for="site-product-variant-${index}">Choose size or color for ${escapeHtml(item.name)}</label><select class="site-product-variant" id="site-product-variant-${index}" data-product-variant data-product-index="${index}">${variants.map(variant => `<option value="${escapeHtml(variant.id)}">${escapeHtml(variant.name)} · ${escapeHtml(variant.price)} ${escapeHtml(variant.currency)}</option>`).join('')}</select>` : '';
          const purchase = checkoutUrl ? `<a class="site-button site-product-buy ${style} shape-${shape}" data-product-buy data-product-index="${index}" href="${escapeHtml(checkoutUrl)}" target="_blank" rel="noopener noreferrer">${item.provider === 'fourthwall' ? 'Buy now' : 'Shop now'} <span aria-hidden="true">↗</span></a>` : '<span class="site-product-buy site-product-coming-soon">Checkout link coming soon</span>';
          return `<article class="site-product"><div class="site-product-image-wrap">${image}</div><div class="site-product-info"><div class="site-product-title-row"><h3>${escapeHtml(item.name)}</h3>${price ? `<span class="site-product-price">${escapeHtml(price)}</span>` : ''}</div>${item.description ? `<p>${escapeHtml(item.description)}</p>` : ''}${selector}${purchase}</div></article>`;
        }).join('')}</div>` : '<div class="site-shop-empty"><strong>Merch drop in progress</strong><span>New creator gear is on the way. Check back soon for shirts, stream-inspired designs, and more.</span></div>';
        shop.innerHTML = `<div class="site-shop-heading"><div class="site-section-head"><p class="site-kicker">Creator merch</p><h2>Shop the collection</h2><p class="site-shop-intro">Channel-inspired essentials and community favorites, in one place.</p></div><span class="site-shop-count">${products.length} ${products.length === 1 ? 'item' : 'items'}</span></div>${shopContent}`;
        document.querySelector('.site-featured').insertAdjacentElement('afterend', shop);
        shop.addEventListener('change', event => {
          const selector = event.target.closest('[data-product-variant]');
          if (!selector) return;
          const product = products[Number(selector.dataset.productIndex)];
          const variant = product?.variants.find(item => item.id === selector.value);
          const buyLink = shop.querySelector(`[data-product-buy][data-product-index="${selector.dataset.productIndex}"]`);
          if (!product || !variant || !buyLink || !fourthwallDomain) return;
          const checkout = new URL('/cart/checkout', fourthwallDomain);
          checkout.searchParams.set('products', `${variant.id}:1`);
          checkout.searchParams.set('currency', variant.currency || product.currency || 'USD');
          buyLink.href = checkout.href;
          const price = buyLink.closest('.site-product-info')?.querySelector('.site-product-price');
          if (price) price.textContent = `${variant.price} ${variant.currency}`;
        });
      }
      if (!tagline) document.querySelector('.site-hero-tagline')?.remove();
      const heroCopy = document.querySelector('.site-hero-copy');
      const statusBadge = heroCopy.querySelector('[data-live-status]');
      const handleLabel = heroCopy.querySelector('.site-eyebrow');
      const creatorName = heroCopy.querySelector('h1');
      if (heroTitleImage) {
        const titleImage = document.createElement('img');
        titleImage.className = 'site-hero-title-image';
        titleImage.src = heroTitleImage;
        titleImage.alt = name;
        titleImage.loading = 'eager';
        creatorName.replaceChildren(titleImage);
      }
      const identity = document.createElement('div');
      const identityCopy = document.createElement('div');
      const logo = document.createElement('div');
      identity.className = 'site-identity';
      identityCopy.className = 'site-identity-copy';
      logo.className = 'site-hero-logo';
      if (avatar) {
        const logoImage = document.createElement('img');
        logoImage.src = avatar;
        logoImage.alt = `${name} logo`;
        logoImage.loading = 'eager';
        logo.append(logoImage);
      } else {
        logo.textContent = initials || 'C';
        logo.setAttribute('aria-hidden', 'true');
      }
      identityCopy.append(handleLabel, creatorName);
      identity.append(logo, identityCopy);
      statusBadge.after(identity);
      if (socialIconMarkup) {
        const socialNav = document.createElement('nav');
        socialNav.className = 'site-hero-socials';
        socialNav.setAttribute('aria-label', 'Social media links');
        socialNav.innerHTML = socialIconMarkup;
        document.querySelector('.site-hero')?.prepend(socialNav);
      }
      const featureGrid = document.querySelector('.site-featured .site-feature-grid');
      const featureCards = featureGrid ? [...featureGrid.children].filter(card => card.matches('.site-feature')) : [];
      if (featureGrid && featureCards.length) {
        featureGrid.classList.add('site-feature-row');
        featureGrid.replaceChildren(...featureCards.slice(0, 3));
        const remainingCards = featureCards.slice(3);
        if (remainingCards.length) {
          const carousel = document.createElement('div');
          carousel.className = 'site-feature-carousel';
          carousel.setAttribute('aria-label', 'More recent highlights');
          const controls = document.createElement('div');
          controls.className = 'site-feature-carousel-controls';
          const previous = document.createElement('button');
          previous.type = 'button';
          previous.setAttribute('aria-label', 'Previous highlights');
          previous.textContent = '‹';
          const pageLabel = document.createElement('span');
          pageLabel.className = 'site-feature-carousel-page';
          pageLabel.setAttribute('aria-live', 'polite');
          const next = document.createElement('button');
          next.type = 'button';
          next.setAttribute('aria-label', 'Next highlights');
          next.textContent = '›';
          controls.append(previous, pageLabel, next);
          const slides = [];
          for (let offset = 0; offset < remainingCards.length; offset += 3) {
            const slide = document.createElement('div');
            slide.className = 'site-feature-grid site-feature-slide';
            slide.append(...remainingCards.slice(offset, offset + 3));
            slide.hidden = slides.length > 0;
            slides.push(slide);
          }
          let currentPage = 0;
          const showPage = page => {
            currentPage = Math.max(0, Math.min(slides.length - 1, page));
            slides.forEach((slide, index) => { slide.hidden = index !== currentPage; });
            previous.disabled = currentPage === 0;
            next.disabled = currentPage === slides.length - 1;
            pageLabel.textContent = `${currentPage + 1} / ${slides.length}`;
          };
          previous.addEventListener('click', () => showPage(currentPage - 1));
          next.addEventListener('click', () => showPage(currentPage + 1));
          showPage(0);
          carousel.append(controls, ...slides);
          featureGrid.insertAdjacentElement('afterend', carousel);
        }
      }
      const broadcast = document.createElement('section');
      broadcast.className = 'site-broadcast';
      broadcast.setAttribute('aria-label', 'Twitch broadcast status');
      broadcast.innerHTML = `<div><p class="site-broadcast-label"><span class="site-status-dot"></span><span data-broadcast-label>Checking channel</span></p><h2 data-broadcast-title>Finding the next stream</h2><p class="site-broadcast-copy" data-broadcast-copy>Live updates from Twitch</p></div><div class="site-broadcast-stat"><span data-broadcast-stat-label>Channel</span><strong data-broadcast-stat>On Twitch</strong></div>${twitchUrl ? `<a class="site-button site-broadcast-link ${style} shape-${shape}" data-broadcast-link href="${escapeHtml(twitchUrl)}" target="_blank" rel="noopener noreferrer">Visit channel <span aria-hidden="true">↗</span></a>` : ''}`;
      document.querySelector('.site-hero').insertAdjacentElement('afterend', broadcast);
      const updateCreatorImages = imageUrl => {
        const validImageUrl = safeImage(avatar || imageUrl);
        if (!validImageUrl) return;
        document.querySelectorAll('.site-hero-logo, .site-mark').forEach(container => {
          let image = container.querySelector('img');
          if (!image) {
            container.textContent = '';

            image.alt = container.classList.contains('site-hero-logo') ? `${name} logo` : '';
            container.append(image);
          }
          image.src = validImageUrl;
        });
      };
      const setLiveState = stream => {
        live = Boolean(stream.live);
        updateCreatorImages(stream.profileImageUrl);
        liveStatusResolved = true;
        liveStatusLabel = live ? 'Live now on Twitch' : 'Currently offline';
        liveStatusClass = live ? 'live' : '';
        const status = document.querySelector('[data-live-status]');
        if (status) {
          status.className = `site-status ${liveStatusClass}`;
          status.innerHTML = `<span class="site-status-dot"></span>${liveStatusLabel}`;
          if (live && stream.game) status.setAttribute('aria-label', `Live now on Twitch, playing ${stream.game}`);
        }
        document.querySelectorAll('[data-live-cta]').forEach(link => { link.firstChild.textContent = live ? 'Join the live stream ' : `${primaryCta} `; });
        const navCta = document.querySelector('[data-nav-live-cta]');
        if (navCta) navCta.firstChild.textContent = live ? 'Live now ' : 'Twitch ';
        const broadcastPanel = document.querySelector('.site-broadcast');
        const broadcastLabel = document.querySelector('[data-broadcast-label]');
        const broadcastTitle = document.querySelector('[data-broadcast-title]');
        const broadcastCopy = document.querySelector('[data-broadcast-copy]');
        const broadcastStatLabel = document.querySelector('[data-broadcast-stat-label]');
        const broadcastStat = document.querySelector('[data-broadcast-stat]');
        const broadcastLink = document.querySelector('[data-broadcast-link]');
        broadcastPanel?.classList.toggle('is-live', live);
        if (broadcastLabel) broadcastLabel.textContent = live ? 'On air now' : 'Off air';
        if (broadcastTitle) broadcastTitle.textContent = live ? (stream.title || 'Live on Twitch') : 'No stream right now';
        if (broadcastCopy) broadcastCopy.textContent = live ? (stream.game || `Join ${name} on Twitch`) : 'Check the schedule above for the next stream.';
        if (broadcastStatLabel) broadcastStatLabel.textContent = live && Number.isFinite(stream.viewerCount) ? 'Viewers' : 'Channel';
        if (broadcastStat) broadcastStat.textContent = live && Number.isFinite(stream.viewerCount) ? stream.viewerCount.toLocaleString() : (live ? 'Live' : 'Twitch');
        if (broadcastLink) broadcastLink.innerHTML = `${live ? 'Join live' : 'Visit channel'} <span aria-hidden="true">↗</span>`;
      };
      const setLiveStatusUnavailable = () => {
        if (liveStatusResolved) return;
        const status = document.querySelector('[data-live-status]');
        if (!status) return;
        liveStatusLabel = 'Live status unavailable';
        liveStatusClass = 'unavailable';
        status.className = `site-status ${liveStatusClass}`;
        status.innerHTML = `<span class="site-status-dot"></span>${liveStatusLabel}`;
        const broadcastLabel = document.querySelector('[data-broadcast-label]');
        const broadcastTitle = document.querySelector('[data-broadcast-title]');
        const broadcastCopy = document.querySelector('[data-broadcast-copy]');
        if (broadcastLabel) broadcastLabel.textContent = 'Status unavailable';
        if (broadcastTitle) broadcastTitle.textContent = 'Visit the Twitch channel';
        if (broadcastCopy) broadcastCopy.textContent = 'Live status could not be checked right now.';
      };
      const refreshLiveState = async () => {
        if (!twitchLogin || liveStatusRequestPending) return;
        liveStatusRequestPending = true;
        try {
          const endpoint = new URL(twitchStatusEndpoint);
          endpoint.searchParams.set('login', twitchLogin);
          const response = await fetch(endpoint, { headers: { Accept: 'application/json' }, signal: AbortSignal.timeout(8000) });
          if (!response.ok) { setLiveStatusUnavailable(); return; }
          const status = await response.json();
          if (typeof status.live === 'boolean') setLiveState(status);
          else setLiveStatusUnavailable();
        } catch { setLiveStatusUnavailable(); } finally { liveStatusRequestPending = false; }
      };
      if (twitchLogin) {
        refreshLiveState();
        window.setInterval(() => { if (document.visibilityState === 'visible') refreshLiveState(); }, twitchStatusIntervalMs);
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshLiveState(); });
      }
      const sectionLinks = [...document.querySelectorAll('.site-nav-links a')];
      let activeSectionId = '';
      const updateActiveSection = () => {
        const marker = window.scrollY + document.querySelector('.site-nav').offsetHeight + 110;
        let activeId = '';
        for (const id of ['about', 'highlights', 'shop', 'community']) {
          if (!document.getElementById(id)) continue;
          if (document.getElementById(id).offsetTop <= marker) activeId = id;
        }
        if (window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2) activeId = 'community';
        sectionLinks.forEach(link => link.classList.toggle('is-active', link.hash === `#${activeId}`));
        if (activeId && activeId !== activeSectionId) {
          activeSectionId = activeId;
          document.querySelector(`.site-nav-links a[href="#${activeId}"]`)?.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
        }
      };
      window.addEventListener('scroll', updateActiveSection, { passive: true });
      window.addEventListener('resize', updateActiveSection);
      updateActiveSection();
    })();
  </script>
